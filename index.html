<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCE — Catalogue & Achats</title>
<style>
    :root {
        --bg: #0B1220;
        --card: #131C2E;
        --card-hover: #182238;
        --border: #24304A;
        --text: #E5EAF3;
        --text-muted: #94A3B8;
        --text-faint: #64748B;
        --blue: #60A5FA;
        --blue-dim: rgba(96,165,250,.12);
        --lime: #A3E635;
        --amber: #FBBF24;
        --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
        position: sticky; top: 0; z-index: 20;
        background: linear-gradient(180deg, #0E1730 0%, rgba(11,18,32,.97) 100%);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(8px);
    }
    .header-inner {
        max-width: 1400px; margin: 0 auto; padding: 18px 24px 0;
    }
    .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .brand h1 {
        font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
        background: linear-gradient(90deg, var(--blue), var(--lime));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .brand .sub { color: var(--text-faint); font-size: 12px; width: 100%; margin-top: -4px; }
    .logo { width: 40px; height: 40px; flex-shrink: 0; filter: drop-shadow(0 0 12px rgba(163,230,53,.35)); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .updated { font-size: 11px; color: var(--text-faint); }
    .btn-refresh {
        padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--card); color: var(--text-muted); font-size: 13px;
        cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px;
    }
    .btn-refresh:hover { border-color: var(--blue); color: var(--blue); }
    .btn-refresh:disabled { opacity: .5; cursor: default; }

    /* ─── Tabs ─── */
    .tabs { display: flex; gap: 4px; margin-top: 16px; }
    .tab {
        padding: 10px 22px; border: none; background: transparent;
        color: var(--text-muted); font-size: 14px; font-weight: 600;
        cursor: pointer; border-bottom: 3px solid transparent;
        transition: all .15s; display: flex; align-items: center; gap: 8px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--lime); }
    .tab .count {
        font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
        background: var(--blue-dim); color: var(--blue);
    }

    /* ─── Layout ─── */
    main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 60px; }

    /* ─── Toolbar ─── */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .search {
        flex: 1; min-width: 220px; padding: 9px 16px;
        border-radius: 8px; border: 1px solid var(--border);
        background: var(--card); color: var(--text); font-size: 13px; outline: none;
        transition: border-color .15s;
    }
    .search:focus { border-color: var(--blue); }
    select, .dir-btn {
        padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--card); color: var(--text); font-size: 12px;
        cursor: pointer; outline: none;
    }
    select:hover, .dir-btn:hover { border-color: var(--blue); }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-group label { font-size: 12px; color: var(--text-faint); font-weight: 600; white-space: nowrap; }

    /* ─── Category chips ─── */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip {
        padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
        background: transparent; color: var(--text-muted); font-size: 12px;
        cursor: pointer; transition: all .15s;
    }
    .chip:hover { background: rgba(255,255,255,.04); }
    .chip.active { border-color: var(--blue); background: var(--blue-dim); color: var(--blue); font-weight: 600; }
    .chip.active.fav { border-color: var(--amber); background: rgba(251,191,36,.1); color: var(--amber); }

    /* ─── Stats bar ─── */
    .stats {
        display: flex; gap: 24px; flex-wrap: wrap;
        padding: 12px 18px; margin-bottom: 16px;
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .stat .v { font-size: 18px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
    .stat .v.accent { color: var(--lime); }

    /* ─── Table ─── */
    .table-wrap {
        overflow-x: auto; border: 1px solid var(--border);
        border-radius: var(--radius); background: var(--card);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
        position: sticky; top: 0;
        padding: 12px; text-align: right; white-space: nowrap;
        background: #0F1830; color: var(--text-muted);
        font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
        border-bottom: 2px solid var(--border);
    }
    thead th.l, td.l { text-align: left; }
    tbody td {
        padding: 9px 12px; text-align: right; white-space: nowrap;
        color: var(--text-muted); border-bottom: 1px solid rgba(36,48,74,.5);
    }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: var(--card-hover); }
    tbody tr:last-child td { border-bottom: none; }
    .ref { font-family: 'Cascadia Code', Consolas, monospace; color: var(--blue); font-size: 12px; }
    .desig { color: var(--text); max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
    .num { font-family: Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
    .cat-badge {
        padding: 2px 9px; border-radius: 10px; background: var(--blue-dim);
        color: var(--blue); font-size: 11px;
    }
    .star { color: var(--amber); font-size: 14px; }
    .star.off { color: #374151; }
    .empty { padding: 48px; text-align: center; color: var(--text-faint); }

    /* ─── Pagination ─── */
    .pager {
        display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 10px; margin-top: 14px;
        font-size: 12px; color: var(--text-faint);
    }
    .pager .btns { display: flex; align-items: center; gap: 8px; }
    .pager button {
        padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--card); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .pager button:disabled { opacity: .4; cursor: default; }
    .pager button:not(:disabled):hover { border-color: var(--blue); }

    /* ─── Loader / error ─── */
    .loader { text-align: center; padding: 80px 20px; color: var(--text-faint); }
    .loader .spin {
        width: 36px; height: 36px; margin: 0 auto 16px;
        border: 3px solid var(--border); border-top-color: var(--lime);
        border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
        max-width: 480px; margin: 60px auto; padding: 24px;
        background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3);
        border-radius: var(--radius); color: #FCA5A5; text-align: center; font-size: 13px;
    }
    .pulse { animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
    @keyframes pulse { 50% { opacity: .3; transform: rotate(20deg); } }

    /* ─── Modales ─── */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.6);
        z-index: 50; display: flex; align-items: center; justify-content: center;
        padding: 24px; backdrop-filter: blur(3px);
    }
    .modal {
        background: var(--card); border: 1px solid var(--border); border-radius: 14px;
        max-width: 660px; width: 100%; max-height: 88vh; overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .modal.wide { max-width: 1020px; height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head {
        padding: 18px 22px; border-bottom: 1px solid var(--border);
        display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
    }
    .modal-head h2 { font-size: 17px; font-weight: 700; margin: 2px 0 6px; }
    .modal-head .ref-lg { font-family: Consolas, monospace; font-size: 12px; color: var(--blue); }
    .modal-close { background: none; border: none; color: var(--text-faint); font-size: 26px; cursor: pointer; line-height: 1; padding: 0 4px; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 18px 22px; }
    .modal-sub { font-size: 12px; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

    .info-cards { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .info-card { flex: 1 1 130px; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    .info-card .l { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .info-card .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .info-card .v.accent { color: var(--lime); }

    .hist-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .hist-item {
        padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--bg); margin-bottom: 8px;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px;
    }
    .hist-item .when { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .hist-item .who { font-weight: 600; color: var(--text-muted); }
    .hist-item .what { color: var(--text-faint); font-variant-numeric: tabular-nums; }
    .chantier-badge {
        padding: 1px 7px; border-radius: 4px; background: var(--blue-dim);
        color: var(--blue); font-size: 10px; font-weight: 600;
    }

    .doc-badge {
        display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
        border-radius: 6px; font-size: 10px; font-weight: 700;
        cursor: pointer; border: 1px solid; transition: filter .15s;
    }
    .doc-badge:hover { filter: brightness(1.4); }
    .doc-btn {
        padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--bg); color: var(--text-muted); font-size: 11px; cursor: pointer;
        transition: all .15s;
    }
    .doc-btn:hover { border-color: var(--blue); color: var(--blue); }
    .doc-btn.open { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
    tr.doc-row td { background: rgba(96,165,250,.05); padding: 6px 12px 10px; }
    .chart-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 18px; }
    .supp-table { width: 100%; margin-top: 12px; font-size: 11px; border-collapse: collapse; }
    .supp-table th { color: var(--text-faint); text-transform: uppercase; font-size: 10px; text-align: right; padding: 4px 6px; font-weight: 600; }
    .supp-table th:first-child { text-align: left; }
    .supp-table td { padding: 4px 6px; text-align: right; border-top: 1px solid var(--border); }
    .supp-table td:first-child { text-align: left; color: var(--text-muted); }
    .doc-iframe { flex: 1; border: none; background: #525659; }
    .doc-fallback { padding: 8px 22px; font-size: 12px; color: var(--text-faint); border-top: 1px solid var(--border); }
    .doc-fallback a { color: var(--blue); }

    tr.rowlink { cursor: pointer; }
    .clickable-ref { cursor: pointer; border-bottom: 1px dotted var(--blue); }
    .clickable-ref:hover { color: var(--lime); border-bottom-color: var(--lime); }

    footer {
        text-align: center; padding: 20px; color: var(--text-faint); font-size: 11px;
        border-top: 1px solid var(--border);
    }

    @media (max-width: 720px) {
        .header-inner, main { padding-left: 14px; padding-right: 14px; }
        .desig { max-width: 200px; }
        .brand h1 { font-size: 18px; }
    }
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <svg class="logo" viewBox="0 0 64 64" fill="none">
                <defs>
                    <linearGradient id="lg" x1="0" y1="0" x2="64" y2="64">
                        <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A3E635"/>
                    </linearGradient>
                </defs>
                <path d="M32 6C21 6 13 14.5 13 25c0 7 3.5 12 8 15.5 2.5 2 4 4.5 4 7.5h14c0-3 1.5-5.5 4-7.5C47.5 37 51 32 51 25 51 14.5 43 6 32 6z" stroke="url(#lg)" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
                <path d="M26 52h12M27 57h10" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M32 18v10m0 0l-5-5m5 5l5-5" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".0"/>
                <path d="M27 25c0-3 2-5 5-5" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <h1>Catalogue &amp; Achats</h1>
            <div class="header-right">
                <span class="updated" id="updatedAt"></span>
                <button class="btn-refresh" id="btnRefresh" onclick="loadData(true)">↻ Actualiser</button>
            </div>
            <div class="sub">LMCE · électricité générale — consultation en lecture seule</div>
        </div>
        <div class="tabs">
            <button class="tab active" id="tabCatalogue" onclick="switchTab('catalogue')">📦 Catalogue <span class="count" id="countMaterials"></span></button>
            <button class="tab" id="tabAchats" onclick="switchTab('achats')">🧾 Achats <span class="count" id="countPurchases"></span></button>
        </div>
    </div>
</header>

<main id="app">
    <div class="loader"><div class="spin"></div>Chargement des données…</div>
</main>

<div id="modalRoot"></div>
<div id="docRoot"></div>

<footer>Données en lecture seule · actualisation automatique toutes les 5 minutes</footer>

<script>
'use strict';

const SUPABASE_URL = 'https://tngktylqmmzxbhxojcwt.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ2t0eWxxbW16eGJoeG9qY3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNTczNjMsImV4cCI6MjA4ODYzMzM2M30.9wvNlFiz7D0PwE_z0-cFspl1-FFju79FZu1SrzHfJmE';

// ─── État ────────────────────────────────────────────────────────────────────

const DB = { materials: [], purchases: [], avgPrice: new Map(), purchaseCount: new Map(), materialProjects: new Map() };

const cat = { search: '', category: 'Tous', brand: '', gamme: '', project: '', sort: 'designation', dir: 'asc', page: 1 };
const pur = { search: '', project: '', supplier: '', period: 'all', sort: 'date', dir: 'desc', page: 1 };
let currentTab = 'catalogue';
const PAGE_SIZE = 50;

// ─── Helpers ─────────────────────────────────────────────────────────────────

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtEur = v => v == null ? '—' : v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const fmtDate = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
// encodeURIComponent n'échappe PAS l'apostrophe → on la force en %27
// pour pouvoir insérer le résultat dans un onclick='...' sans casser le JS
const jsq = s => encodeURIComponent(String(s ?? '')).replace(/'/g, '%27');

// ─── Chargement Supabase (lecture seule, GET uniquement) ─────────────────────

async function fetchAll(table, query) {
    const CHUNK = 1000;
    let from = 0, all = [];
    for (;;) {
        const sep = query.includes('?') ? '&' : '?';
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${query}${sep}offset=${from}&limit=${CHUNK}`, {
            headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
        });
        if (!res.ok) throw new Error(`${table}: HTTP ${res.status}`);
        const rows = await res.json();
        all = all.concat(rows);
        if (rows.length < CHUNK) break;
        from += CHUNK;
    }
    return all;
}

let lastLoad = 0;

async function loadData(force) {
    const btn = document.getElementById('btnRefresh');
    btn.disabled = true;
    btn.innerHTML = '<span class="pulse">↻</span> Chargement…';
    try {
        const [materials, purchases] = await Promise.all([
            fetchAll('materials', 'materials?select=id,reference,designation,brand,gamme,category,unit,is_favorite,last_purchase_price,created_at&order=designation'),
            fetchAll('purchases', 'purchases?select=id,quantity,unit_price,supplier,purchase_date,created_at,doc_type,doc_reference,doc_drive_file_id,material_id,materials(reference,designation,brand),projects(name),purchase_documents(doc_type,doc_reference,drive_file_id,purchase_date)&order=purchase_date.desc.nullslast,created_at.desc'),
        ]);
        DB.materials = materials;
        DB.purchases = purchases;
        lastLoad = Date.now();
        computeAvgPrices();
        document.getElementById('countMaterials').textContent = materials.length;
        document.getElementById('countPurchases').textContent = purchases.length;
        document.getElementById('updatedAt').textContent = 'Mis à jour ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        render();
    } catch (e) {
        document.getElementById('app').innerHTML =
            `<div class="error-box"><b>Erreur de chargement</b><br><br>${esc(e.message)}<br><br>Vérifiez votre connexion puis <a href="" style="color:#FCA5A5">rechargez la page</a>.</div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = '↻ Actualiser';
    }
}

// Prix moyen pondéré sur les 6 derniers mois (même logique que l'app)
function computeAvgPrices() {
    const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - 6);
    const acc = new Map();
    for (const p of DB.purchases) {
        if (!p.material_id) continue;
        const d = p.purchase_date || p.created_at;
        if (d < cutoff.toISOString()) continue;
        const e = acc.get(p.material_id) || { s: 0, q: 0 };
        e.s += p.quantity * p.unit_price; e.q += p.quantity;
        acc.set(p.material_id, e);
    }
    DB.avgPrice = new Map([...acc].filter(([, v]) => v.q > 0).map(([k, v]) => [k, v.s / v.q]));
    // Nb d'achats par article (calculé côté client : pas de colonne en base)
    const counts = new Map();
    // Map article → chantiers (pour le filtre chantier du catalogue)
    const matProj = new Map();
    for (const p of DB.purchases) {
        if (p.material_id) counts.set(p.material_id, (counts.get(p.material_id) || 0) + 1);
        if (p.material_id && p.projects?.name) {
            if (!matProj.has(p.material_id)) matProj.set(p.material_id, new Set());
            matProj.get(p.material_id).add(p.projects.name);
        }
    }
    DB.purchaseCount = counts;
    DB.materialProjects = matProj;
}

// ─── Navigation ──────────────────────────────────────────────────────────────

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabCatalogue').classList.toggle('active', tab === 'catalogue');
    document.getElementById('tabAchats').classList.toggle('active', tab === 'achats');
    render();
}

// ─── Catalogue ───────────────────────────────────────────────────────────────

function catalogFiltered() {
    const s = cat.search.toLowerCase();
    const list = DB.materials.filter(m => {
        if (s && !((m.reference || '').toLowerCase().includes(s)
            || m.designation.toLowerCase().includes(s)
            || (m.brand || '').toLowerCase().includes(s))) return false;
        if (cat.category === 'Favoris' && !m.is_favorite) return false;
        if (cat.category !== 'Tous' && cat.category !== 'Favoris' && m.category !== cat.category) return false;
        if (cat.brand && m.brand !== cat.brand) return false;
        if (cat.gamme && m.gamme !== cat.gamme) return false;
        if (cat.project && !(DB.materialProjects.get(m.id)?.has(cat.project))) return false;
        return true;
    });
    const dir = cat.dir === 'asc' ? 1 : -1;
    const cs = (a, b) => { // chaînes vides en fin de liste
        if (!a && !b) return 0; if (!a) return 1; if (!b) return -1;
        return String(a).toLowerCase().localeCompare(String(b).toLowerCase(), 'fr') * dir;
    };
    list.sort((a, b) => {
        if (cat.category === 'Tous') {
            if (a.is_favorite && !b.is_favorite) return -1;
            if (!a.is_favorite && b.is_favorite) return 1;
        }
        switch (cat.sort) {
            case 'reference': return cs(a.reference, b.reference);
            case 'brand': return cs(a.brand, b.brand);
            case 'gamme': return cs(a.gamme, b.gamme);
            case 'created_at': return (a.created_at < b.created_at ? -1 : 1) * dir;
            case 'last_price': return ((a.last_purchase_price ?? -1) - (b.last_purchase_price ?? -1)) * dir;
            case 'purchase_count': return ((DB.purchaseCount.get(a.id) || 0) - (DB.purchaseCount.get(b.id) || 0)) * dir;
            default: return a.designation.localeCompare(b.designation, 'fr') * dir;
        }
    });
    return list;
}

function renderCatalogue() {
    const categories = [...new Set(DB.materials.map(m => m.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
    const brands = [...new Set(DB.materials.map(m => m.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));

// ─── Achats ──────────────────────────────────────────────────────────────────

function purchasesFiltered() {
    const s = pur.search.toLowerCase();
    const cutoff = { '30j': 30, '6m': 180, '1a': 365 }[pur.period];
    const minDate = cutoff ? new Date(Date.now() - cutoff * 864e5).toISOString() : null;
    const list = DB.purchases.filter(p => {
        const label = `${p.materials?.reference || ''} ${p.materials?.designation || ''} ${p.supplier || ''} ${p.doc_reference || ''}`.toLowerCase();
        if (s && !label.includes(s)) return false;
        if (pur.project && p.projects?.name !== pur.project) return false;
        if (pur.supplier === '__none__') { if (p.supplier) return false; }
        else if (pur.supplier && (p.supplier || '') !== pur.supplier) return false;
        if (minDate && (p.purchase_date || p.created_at) < minDate) return false;
        return true;
    });
    const dir = pur.dir === 'asc' ? 1 : -1;
    list.sort((a, b) => {
        switch (pur.sort) {
            case 'designation': return (a.materials?.designation || '').localeCompare(b.materials?.designation || '', 'fr') * dir;
            case 'amount': return (a.quantity * a.unit_price - b.quantity * b.unit_price) * dir;
            case 'supplier': return (a.supplier || '').localeCompare(b.supplier || '', 'fr') * dir;
            default: return ((a.purchase_date || a.created_at) < (b.purchase_date || b.created_at) ? -1 : 1) * dir;
        }
    });
    return list;
}

    return `

            <select onchange="purSet('period', this.value)">
                ${[['all', 'Tout'], ['30j', '30 jours'], ['6m', '6 mois'], ['1a', '1 an']]
                    .map(([v, l]) => `<option value="${v}" ${pur.period === v ? 'selected' : ''}>${l}</option>`).join('')}

// ─── Composants partagés & actions ───────────────────────────────────────────

function pager(total, page, fn) {
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    return `
    <div class="pager">
        <span>${total} résultat${total > 1 ? 's' : ''} · page ${page} / ${pages}</span>
        <div class="btns">
            <button onclick="${fn}(-1)" ${page <= 1 ? 'disabled' : ''}>← Précédent</button>
            <button onclick="${fn}(1)" ${page >= pages ? 'disabled' : ''}>Suivant →</button>
        </div>
    </div>`;
}

const rerender = debounce(render, 150);
function render() {
    document.getElementById('app').innerHTML = currentTab === 'catalogue' ? renderCatalogue() : renderAchats();
}

function catSearch(v) { cat.search = v; cat.page = 1; rerender(); }
function catSet(k, v) { cat[k] = v; if (k === 'brand') cat.gamme = ''; cat.page = 1; render(); }
function catSort(v) { cat.sort = v; cat.dir = (v === 'created_at' || v === 'purchase_count' || v === 'last_price') ? 'desc' : 'asc'; cat.page = 1; render(); }
function catDir() { cat.dir = cat.dir === 'asc' ? 'desc' : 'asc'; render(); }
function catPage(d) { cat.page += d; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function purSearch(v) { pur.search = v; pur.page = 1; rerender(); }
function purSet(k, v) { pur[k] = v; pur.page = 1; render(); }
function purSort(v) { pur.sort = v; pur.dir = v === 'date' || v === 'amount' ? 'desc' : 'asc'; pur.page = 1; render(); }
function purDir() { pur.dir = pur.dir === 'asc' ? 'desc' : 'asc'; render(); }
function purPage(d) { pur.page += d; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ─── Fiche article & aperçu documents ───────────────────────────────────────

const DOC_META = {
    devis:                 { label: 'DEVIS',       color: '#F59E0B' },
    devis_signe:           { label: 'DEVIS SIGNÉ', color: '#10B981' },
    confirmation_commande: { label: 'CC / AR',     color: '#3B82F6' },
    facture:               { label: 'FACTURE',     color: '#8B5CF6' },
};
const DOC_ORDER = { devis: 0, devis_signe: 1, confirmation_commande: 2, facture: 3 };

// Tous les documents d'un achat (devis + AR + facture…), triés chronologiquement
function docsOf(p) {
    let docs = (p.purchase_documents || []).map(d => ({
        doc_type: d.doc_type, doc_reference: d.doc_reference,
        drive_file_id: d.drive_file_id, date: d.purchase_date,
    }));
    if (!docs.length && p.doc_type) {
        docs = [{ doc_type: p.doc_type, doc_reference: p.doc_reference, drive_file_id: p.doc_drive_file_id, date: p.purchase_date }];
    }
    return docs.sort((a, b) => (DOC_ORDER[a.doc_type] ?? 9) - (DOC_ORDER[b.doc_type] ?? 9));
}

function docBadgeDoc(d) {
    const meta = DOC_META[d.doc_type] || { label: (d.doc_type || 'DOC').toUpperCase(), color: '#9CA3AF' };
    const label = meta.label + (d.doc_reference ? ' ' + d.doc_reference : '');
    const style = `color:${meta.color};border-color:${meta.color}55;background:${meta.color}18`;
    if (!d.drive_file_id) return `<span class="doc-badge" style="${style};cursor:default">${esc(label)}</span>`;
    return `<span class="doc-badge" style="${style}" title="Aperçu du document"
        onclick="event.stopPropagation();openDoc('${d.drive_file_id}', decodeURIComponent('${jsq(label)}'))">${esc(label)} 👁</span>`;
}

// Lignes de documents dépliées dans l'onglet Achats
const expandedDocs = new Set();
function toggleDocs(id) {
    if (expandedDocs.has(id)) expandedDocs.delete(id); else expandedDocs.add(id);
    render();
}

// Fiche article ouverte + page courante de son historique
let currentMaterialId = null;
let currentHistPage = 1;

// ─── Graphiques (SVG maison, aucune librairie) ──────────────────────────────

function priceChartSVG(hist) {
    const pts = hist.map(p => ({ d: p.purchase_date || p.created_at, price: p.unit_price }))
        .sort((a, b) => a.d < b.d ? -1 : 1);
    if (pts.length < 2) return '';
    const W = 620, H = 160, PL = 50, PR = 14, PT = 14, PB = 26;
    const prices = pts.map(p => p.price);
    let lo = Math.min(...prices), hi = Math.max(...prices);
    if (lo === hi) { lo -= 1; hi += 1; }
    const X = i => PL + i * (W - PL - PR) / (pts.length - 1);
    const Y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
    const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.price).toFixed(1)}`).join(' ');
    const dots = pts.map((p, i) =>
        `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.price).toFixed(1)}" r="4" fill="#A3E635" stroke="#0B1220" stroke-width="1.5"><title>${fmtDate(p.d)} — ${fmtEur(p.price)}</title></circle>`
    ).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
        <line x1="${PL}" y1="${Y(hi)}" x2="${W - PR}" y2="${Y(hi)}" stroke="#24304A" stroke-dasharray="3 4"/>
        <line x1="${PL}" y1="${Y(lo)}" x2="${W - PR}" y2="${Y(lo)}" stroke="#24304A" stroke-dasharray="3 4"/>
        <text x="${PL - 6}" y="${Y(hi) + 3}" fill="#64748B" font-size="10" text-anchor="end">${fmtEur(hi)}</text>
        <text x="${PL - 6}" y="${Y(lo) + 3}" fill="#64748B" font-size="10" text-anchor="end">${fmtEur(lo)}</text>
        <text x="${PL}" y="${H - 8}" fill="#64748B" font-size="10">${fmtDate(pts[0].d)}</text>
        <text x="${W - PR}" y="${H - 8}" fill="#64748B" font-size="10" text-anchor="end">${fmtDate(pts[pts.length - 1].d)}</text>
        <polyline points="${line}" fill="none" stroke="#A3E635" stroke-width="2" stroke-linejoin="round"/>
        ${dots}
    </svg>`;
}

function supplierBlock(hist) {
    if (!hist.length) return '';
    const bySup = new Map();
    for (const p of hist) {
        const s = p.supplier || 'Inconnu';
        const e = bySup.get(s) || { count: 0, min: Infinity, max: -Infinity, sum: 0, last: 0, lastD: '' };
        e.count++; e.sum += p.unit_price;
        e.min = Math.min(e.min, p.unit_price); e.max = Math.max(e.max, p.unit_price);
        const d = p.purchase_date || p.created_at;
        if (d >= e.lastD) { e.lastD = d; e.last = p.unit_price; }
        bySup.set(s, e);
    }
    const comp = [...bySup].map(([supplier, e]) => ({
        supplier, count: e.count, min: e.min, max: e.max, avg: e.sum / e.count, last: e.last,
    })).sort((a, b) => b.count - a.count);
    const maxAvg = Math.max(...comp.map(c => c.avg)) || 1;
    return `
    <div class="hist-title">Comparaison fournisseurs</div>
    <div class="chart-box">
        ${comp.map(c => `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px">
            <span style="width:140px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0" title="${esc(c.supplier)}">${esc(c.supplier)}</span>
            <div style="flex:1;background:rgba(255,255,255,.04);border-radius:4px;height:14px;overflow:hidden">
                <div style="width:${(c.avg / maxAvg * 100).toFixed(1)}%;background:linear-gradient(90deg,#60A5FA,#A3E635);height:100%;border-radius:4px"></div>
            </div>
            <span class="num" style="width:75px;text-align:right;flex-shrink:0">${fmtEur(c.avg)}</span>
        </div>`).join('')}
        <table class="supp-table">
            <thead><tr><th>Fournisseur</th><th>Nb</th><th>Min</th><th>Moy</th><th>Max</th><th>Dernier</th></tr></thead>
            <tbody>${comp.map(c => `<tr>
                <td>${esc(c.supplier)}</td><td>${c.count}</td>
                <td style="color:#34D399">${fmtEur(c.min)}</td><td>${fmtEur(c.avg)}</td>
                <td style="color:#F87171">${fmtEur(c.max)}</td><td style="font-weight:600">${fmtEur(c.last)}</td>
            </tr>`).join('')}</tbody>
        </table>
    </div>`;
}

function openMaterial(id, histPage = 1) {

    if (!m) return;
    currentMaterialId = id;
    currentHistPage = histPage;
    const hist = DB.purchases.filter(p => p.material_id === id); // déjà trié date desc
    const nb = hist.length;
    const HIST_PER_PAGE = 5;
    const histPages = Math.max(1, Math.ceil(nb / HIST_PER_PAGE));
    if (histPage > histPages) histPage = currentHistPage = histPages;
    const histPaged = hist.slice((histPage - 1) * HIST_PER_PAGE, histPage * HIST_PER_PAGE);
    const avg = DB.avgPrice.get(id);
    const lastDate = hist.length ? (hist[0].purchase_date || hist[0].created_at) : null;

    document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeMaterial()">
        <div class="modal">
            <div class="modal-head">
                <div>
                    <div class="ref-lg">${esc(m.reference)}</div>
                    <h2>${esc(m.designation)}</h2>
                    <div class="modal-sub">
                        ${m.brand ? `<span>Marque : <b style="color:var(--text)">${esc(m.brand)}</b></span>` : ''}
                        ${m.gamme ? `<span>Gamme : <b style="color:var(--text)">${esc(m.gamme)}</b></span>` : ''}
                        ${m.category ? `<span class="cat-badge">${esc(m.category)}</span>` : ''}
                        <span>Unité : <b style="color:var(--text)">${esc(m.unit)}</b></span>
                        ${m.is_favorite ? '<span class="star">★</span>' : ''}
                    </div>
                </div>
                <button class="modal-close" onclick="closeMaterial()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="info-cards">
                    <div class="info-card"><div class="l">Dernier prix achat</div><div class="v">${fmtEur(m.last_purchase_price)}</div></div>
                    <div class="info-card"><div class="l">Prix moyen 6 mois</div><div class="v">${avg != null ? fmtEur(avg) : '—'}</div></div>
                    <div class="info-card"><div class="l">Nb achats</div><div class="v accent">${nb}</div></div>

                </div>

                <div class="hist-title">Historique des achats (${nb})</div>
                ${nb === 0 ? '<div style="color:var(--text-faint);font-size:13px;padding:12px 0">Aucun achat enregistré pour cet article.</div>' :
                    histPaged.map(p => `
                    <div class="hist-item">
                        <span class="when">${fmtDate(p.purchase_date || p.created_at)}</span>
                        ${p.supplier ? `<span class="who">${esc(p.supplier)}</span>` : ''}
                        <span class="what">${p.quantity} × ${fmtEur(p.unit_price)} = <b style="color:var(--text)">${fmtEur(p.quantity * p.unit_price)}</b></span>
                        ${p.projects?.name ? `<span class="chantier-badge">${esc(p.projects.name)}</span>` : ''}
                        ${docsOf(p).map(docBadgeDoc).join('')}
                    </div>`).join('')}
                ${histPages > 1 ? `
                <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;font-size:12px;color:var(--text-faint)">
                    <button class="doc-btn" ${histPage <= 1 ? 'disabled style="opacity:.4;cursor:default"' : ''} onclick="openMaterial(currentMaterialId, ${histPage - 1})">← Précédent</button>
                    <span>${histPage} / ${histPages}</span>
                    <button class="doc-btn" ${histPage >= histPages ? 'disabled style="opacity:.4;cursor:default"' : ''} onclick="openMaterial(currentMaterialId, ${histPage + 1})">Suivant →</button>
                </div>` : ''}
            </div>
        </div>
    </div>`;
}

function closeMaterial() { document.getElementById('modalRoot').innerHTML = ''; currentMaterialId = null; }

function openDoc(fileId, label) {
    document.getElementById('docRoot').innerHTML = `
    <div class="modal-overlay" style="z-index:60" onclick="if(event.target===this)closeDoc()">
        <div class="modal wide">
            <div class="modal-head">
                <div><h2 style="margin:0">📄 ${esc(label)}</h2></div>
                <button class="modal-close" onclick="closeDoc()">&times;</button>
            </div>
            <iframe class="doc-iframe" src="https://drive.google.com/file/d/${encodeURIComponent(fileId)}/preview" allow="autoplay"></iframe>
            <div class="doc-fallback">
                L'aperçu nécessite un compte Google ayant accès au Drive LMCE.
                <a href="https://drive.google.com/file/d/${encodeURIComponent(fileId)}/view" target="_blank" rel="noopener">Ouvrir dans Google Drive ↗</a>
            </div>
        </div>
    </div>`;
}

function closeDoc() { document.getElementById('docRoot').innerHTML = ''; }

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (document.getElementById('docRoot').firstChild) closeDoc();
        else closeMaterial();
    }
});

// ─── Lien Achats → Catalogue ─────────────────────────────────────────────────

function gotoCatalogueRef(ref) {
    cat.search = ref;
    cat.page = 1;
    switchTab('catalogue');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Init ────────────────────────────────────────────────────────────────────

loadData();

// Auto-actualisation : toutes les 5 min, et au retour sur l'onglet si > 2 min
setInterval(() => { if (!document.hidden) loadData(true); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - lastLoad > 2 * 60 * 1000) loadData(true);
});
</script>
</body>
